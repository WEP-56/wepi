[package]
name = "wepi"
version = "0.2.0"
description = "WEPI desktop app"
edition = "2021"

[lib]
name = "wepi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
base64 = "0.22"
similar = "2.7"
ignore = "0.4"
# WEPI 自管扩展管理用：抓取 pi.dev / skills.sh / npm registry 需要一个
# 简单阻塞式 HTTP 客户端（只在 spawn_blocking 里调用）。
ureq = { version = "2", features = ["json"] }
# 原生目录/文件选择对话框（系统风格，替代 WebView 的 File System Access
# API —— 后者在 WebView2 中会弹浏览器式权限提示且拿不到绝对路径）。
tauri-plugin-dialog = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
